name: Bitbank Trading Bot

on:
  schedule:
    # Every 15 minutes, 24/7
    - cron: '*/15 * * * *'
  workflow_dispatch:  # Manual trigger from GitHub UI

# 同一runを並行起動させない（DB競合防止）
concurrency:
  group: bitbank-trade
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install ccxt pandas ta pyyaml python-dotenv requests

      - name: Prepare data directory
        run: mkdir -p data data/logs

      # GitHub Actions Cache でDBを run 間で永続化する。
      # 保存キーは run ごとにユニーク（github.run_id）にして毎回書き込み、
      # 復元は restore-keys プレフィックスで前回の最新を取得する。
      - name: Restore DB cache
        id: cache-db-restore
        uses: actions/cache/restore@v4
        with:
          path: data/candles.db
          key: bitbank-candles-db-${{ github.run_id }}
          restore-keys: |
            bitbank-candles-db-

      - name: Bootstrap DB from secret (fallback)
        if: steps.cache-db-restore.outputs.cache-matched-key == ''
        env:
          DB_B64: ${{ secrets.DB_B64 }}
        run: |
          if [ -n "$DB_B64" ] && [ ! -f data/candles.db ]; then
            echo "$DB_B64" | base64 -d > data/candles.db
            echo "Database restored from secret (cache miss fallback)"
          else
            echo "No cache and no secret bootstrap; will collect fresh data"
          fi

      - name: Show DB status (pre-tick)
        run: |
          if [ -f data/candles.db ]; then
            echo "DB size: $(wc -c < data/candles.db) bytes"
          else
            echo "DB does not exist yet"
          fi

      - name: Run trading tick
        env:
          BITBANK_API_KEY: ${{ secrets.BITBANK_API_KEY }}
          BITBANK_API_SECRET: ${{ secrets.BITBANK_API_SECRET }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REPORT_EMAIL: ${{ secrets.REPORT_EMAIL }}
        run: |
          cd $GITHUB_WORKSPACE
          python scripts/tick_ci.py

      - name: Show DB status (post-tick)
        if: always()
        run: |
          if [ -f data/candles.db ]; then
            echo "DB size: $(wc -c < data/candles.db) bytes"
          fi

      # run間で永続化（毎回ユニークキーで保存）
      - name: Save DB cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/candles.db
          key: bitbank-candles-db-${{ github.run_id }}

      # 監視用に直近のDBスナップショットをアーティファクトでも保管
      - name: Upload database artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candles-db
          path: data/candles.db
          retention-days: 3
          overwrite: true
